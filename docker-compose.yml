services:
  mysql:
    image: mysql:8.0
    container_name: teacher-load-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: teacher_load
      MYSQL_USER: teacher
      MYSQL_PASSWORD: teacherpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher-load-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: teacher
      DB_PASSWORD: teacherpass
      DB_NAME: teacher_load
      JWT_SECRET: 5f06f02a0a41c0771cbd5086e1f9e4eff6e1687da84c4ad5eaa3fbbf83b7bdd8b4d38448cc0723ad7ad94a5888d5cf7c16d017531cc9d234df625c5ea5f2edf1
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: teacher-load-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
    driver: local